<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나의 게시판</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="board-header">
      <h1>📋 나의 게시판</h1>
      <button class="btn" onclick="location.href='write.html'">글쓰기</button>
    </div>
    <table>
      <thead>
        <tr><th style="width:60px">번호</th><th style="text-align:left">제목</th><th style="width:100px">작성자</th><th style="width:110px">날짜</th></tr>
      </thead>
      <tbody id="postList"></tbody>
    </table>
  </div>

  <script>
    fetch('/api/posts')
      .then(res => res.json())
      .then(posts => {
        const tbody = document.getElementById('postList');
        posts.slice().reverse().forEach(post => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${post.id}</td>
            <td class="title-cell"><a href="detail.html?id=${post.id}">${post.title}</a></td>
            <td>${post.author}</td>
            <td>${post.date}</td>
          `;
          tbody.appendChild(tr);
        });
      });
  </script>
</body>
</html>
